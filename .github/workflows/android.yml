name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Tests unitaires, lint et APK de débogage
        # --warning-mode all : les usages dépréciés (à corriger avant Gradle 10) apparaissent dans le journal.
        run: ./gradlew --no-daemon --warning-mode all testDebugUnitTest lintDebug assembleDebug

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

      - name: APK
        uses: actions/upload-artifact@v7
        with:
          name: onyxfilter-debug-apk
          path: app/build/outputs/apk/debug/*.apk
